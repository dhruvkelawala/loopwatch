[package]
name = "loopwatch"
version = "0.1.0"
description = "Loopwatch desktop shell"
authors = ["Dhruv Kelawala"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
getrandom = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ureq = "3.3.0"
notify-rust = "4.18.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
